# Fallback when the machine's picom cannot parse animation scripts.
backend = "xrender";
vsync = true;
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.18;
shadow-offset-x = -12;
shadow-offset-y = -12;
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 8;
shadow-exclude = [
	"window_type = 'dock'",
	"class_g = 'axiom-panel'",
	"class_g = 'axiom-shell'",
	"_GTK_FRAME_EXTENTS@:c"
];
wintypes:
{
	dock = { shadow = false; fade = false; }
};
