# NuMATE picom configuration.
# Marco's compositor is off. This process owns composition.
#
# Genie: hide/show scale toward the bottom of the window (the dock).
# Picom can scale, offset and fade. It cannot warp a mesh. A real
# Mac-style genie or Compiz wobble is a different compositor.
#
# Unknown keys are ignored by older picom; a parse failure falls
# back to picom-safe.conf via numate-compositor.

backend = "xrender";
vsync = true;
detect-rounded-corners = true;
detect-client-leader = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-ewmh-active-hint = true;
unredir-if-possible = false;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.18;
shadow-offset-x = -12;
shadow-offset-y = -12;

fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 8;
no-fading-destroyed-argb = true;

shadow-exclude = [
	"window_type = 'dock'",
	"window_type = 'desktop'",
	"window_type = 'dnd'",
	"window_type = 'notification'",
	"window_type = 'menu'",
	"window_type = 'dropdown_menu'",
	"window_type = 'popup_menu'",
	"window_type = 'tooltip'",
	"class_g = 'axiom-panel'",
	"class_g = 'axiom-shell'",
	"_GTK_FRAME_EXTENTS@:c"
];

fade-exclude = [
	"window_type = 'dock'",
	"class_g = 'axiom-panel'",
	"class_g = 'axiom-shell'"
];

wintypes:
{
	dock = { shadow = false; fade = false; }
	tooltip = { fade = true; shadow = false; }
	popup_menu = { fade = true; shadow = false; }
	dropdown_menu = { fade = true; shadow = false; }
	menu = { fade = true; shadow = false; }
};

# Picom v12+ animation scripts. Safe to leave in place: numate-compositor
# retries with picom-safe.conf if this file does not parse.
animations = (
	{
		triggers = [ "hide" ];
		opacity = {
			duration = 0.26;
			start = 1;
			end = 0;
			curve = "cubic-bezier(0.4, 0.0, 1.0, 1.0)";
		};
		scale-x = {
			duration = 0.26;
			start = 1;
			end = 0.12;
			curve = "cubic-bezier(0.4, 0.0, 1.0, 1.0)";
		};
		scale-y = {
			duration = 0.26;
			start = 1;
			end = 0.18;
			curve = "cubic-bezier(0.4, 0.0, 1.0, 1.0)";
		};
		offset-y = {
			duration = 0.26;
			start = 0;
			end = 48;
			curve = "cubic-bezier(0.4, 0.0, 1.0, 1.0)";
		};
	},
	{
		triggers = [ "show" ];
		opacity = {
			duration = 0.22;
			start = 0;
			end = 1;
			curve = "cubic-bezier(0.0, 0.0, 0.2, 1.0)";
		};
		scale-x = {
			duration = 0.22;
			start = 0.12;
			end = 1;
			curve = "cubic-bezier(0.0, 0.0, 0.2, 1.0)";
		};
		scale-y = {
			duration = 0.22;
			start = 0.18;
			end = 1;
			curve = "cubic-bezier(0.0, 0.0, 0.2, 1.0)";
		};
		offset-y = {
			duration = 0.22;
			start = 48;
			end = 0;
			curve = "cubic-bezier(0.0, 0.0, 0.2, 1.0)";
		};
	},
	{
		triggers = [ "open" ];
		preset = "appear";
		scale = 0.96;
		duration = 0.18;
	},
	{
		triggers = [ "close" ];
		preset = "disappear";
		scale = 0.96;
		duration = 0.16;
	},
	{
		triggers = [ "geometry" ];
		preset = "geometry-change";
		duration = 0.16;
	}
);
